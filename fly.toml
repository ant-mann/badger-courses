app = "uw-madison-courses"
primary_region = "ord"

[build]
  # Deploy from the repo root: the Docker build needs the pnpm workspace files.
  dockerfile = "web/Dockerfile"

# SUPABASE_DATABASE_URL is required at runtime and is set with `fly secrets set`.
[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
